<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | USA Vacant Land Wholesaler</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <script defer src="/login.js"></script>

  <style>

    :root {
      --bg: #f5f4ef;
      --surface: #ffffff;
      --border: #dcdad0;
      --border-dark: #1a231e;
      --accent: #19382b;         /* Deep Architectural Forest */
      --accent-hover: #0f241b;
      --accent-light: #e6ede8;
      --gold: #b38646;           /* Editorial Warm Gold */
      --text: #141816;
      --text-muted: #5e6661;
      --error: #bc2c2c;

      --font-heading: 'Cinzel', Georgia, serif;
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }

    /* Container Card */
    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      width: 100%;
      max-width: 420px;
      padding: 40px 36px;
      border-radius: 2px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04);
      animation: fadeSlideUp 0.6s var(--ease-out-expo) forwards;
    }

    @keyframes fadeSlideUp {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Header & Branding */
    .brand-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .brand-sub {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--gold);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      display: block;
      margin-bottom: 6px;
    }

    .login-title {
      font-family: var(--font-heading);
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: 0.02em;
    }

    /* Form Layout & Inputs */
    .login-form {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .input-group label {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .input-group input {
      width: 100%;
      padding: 14px 16px;
      font-family: var(--font-body);
      font-size: 0.95rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 2px;
      color: var(--text);
      outline: none;
      transition: border-color 200ms ease, background-color 200ms ease;
    }

    .input-group input:focus {
      border-color: var(--accent);
      background: var(--surface);
    }

    /* Submit Button */
    .btn-login {
      margin-top: 8px;
      padding: 14px 24px;
      background: var(--accent);
      color: #ffffff;
      border: 1px solid var(--accent);
      font-family: var(--font-mono);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 2px;
      transition: all 200ms var(--ease-out-expo);
    }

    .btn-login:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
      transform: translateY(-1px);
    }

    /* Message Output */
    #message {
      margin-top: 18px;
      font-size: 0.85rem;
      font-family: var(--font-mono);
      text-align: center;
      min-height: 1.2em;
      color: var(--error);
    }
  </style>
</head>
<body>

  <main class="login-card">
    <div class="brand-header">
      <span class="brand-sub">USA Vacant Land Wholesaler</span>
      <h1 class="login-title">Account Login</h1>
    </div>

    <form class="login-form" onsubmit="return false;">
      <div class="input-group">
        <label for="username">Username / Email</label>
        <input type="text" id="username" placeholder="Enter your username" autocomplete="username">
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
      </div>

      <button type="submit" id="button" class="btn-login">LOGIN</button>
    </form>

    <p id="message"></p>
  </main>

</body>
</html>
